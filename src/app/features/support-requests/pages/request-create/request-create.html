<form [formGroup]="form"
      (ngSubmit)="save()"
      class="request-form">

    <mat-card>

        <mat-card-header>

            <mat-card-title>
                Nueva solicitud de soporte
            </mat-card-title>

        </mat-card-header>

        <mat-card-content>

            <div class="form-grid">

                <!-- Categoría -->

                <mat-form-field appearance="outline">

                    <mat-label>Categoría</mat-label>

                    <mat-select formControlName="category">

                        <mat-option [value]="1">Software</mat-option>

                        <mat-option [value]="2">Hardware</mat-option>

                        <mat-option [value]="3">Acceso</mat-option>

                    </mat-select>

                </mat-form-field>

                <!-- Prioridad -->

                <mat-form-field appearance="outline">

                    <mat-label>Prioridad</mat-label>

                    <mat-select formControlName="priority">

                        <mat-option [value]="1">Baja</mat-option>

                        <mat-option [value]="2">Media</mat-option>

                        <mat-option [value]="3">Alta</mat-option>

                    </mat-select>

                </mat-form-field>

                <!-- Solicitante -->

                <mat-form-field appearance="outline">

                    <mat-label>Solicitante</mat-label>

                    <input
                        matInput
                        formControlName="requester">

                </mat-form-field>

                <!-- Fecha -->

                <mat-form-field appearance="outline">

                    <mat-label>Fecha</mat-label>

                    <input
                        matInput
                        [matDatepicker]="picker"
                        formControlName="requestDate"
                        [max]="maxDate">

                    <mat-datepicker-toggle
                        matSuffix
                        [for]="picker">
                    </mat-datepicker-toggle>

                    <mat-datepicker #picker></mat-datepicker>

                </mat-form-field>

            </div>

            <!-- Descripción -->

            <mat-form-field
                appearance="outline"
                class="description">

                <mat-label>Descripción</mat-label>

                <textarea
                    matInput
                    rows="3"
                    formControlName="description">
                </textarea>

            </mat-form-field>

        </mat-card-content>

        <mat-card-actions align="end">

            <button
                mat-stroked-button
                routerLink="/">

                Cancelar

            </button>

            <button
                mat-raised-button
                color="primary"
                type="submit">

                Guardar

            </button>

        </mat-card-actions>

    </mat-card>

</form>
