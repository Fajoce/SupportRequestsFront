<div class="actions-header">

    <button
        mat-raised-button
        color="primary"
        routerLink="/create">

        Nueva solicitud

    </button>

</div>
<br>
<app-metrics-dashboard></app-metrics-dashboard>

<h1>
Solicitudes de soporte
</h1>

<mat-card>


<h3>Filtros</h3>


<mat-select
placeholder="Estado"
[(ngModel)]="selectedStatus"
(selectionChange)="filter()">


<mat-option value="Pending">
Pendiente
</mat-option>


<mat-option value="Approved">
Aprobada
</mat-option>


<mat-option value="Rejected">
Rechazada
</mat-option>


</mat-select>

</mat-card>



<br>


<div *ngIf="loading">

<mat-spinner></mat-spinner>

</div>



<table
mat-table
*ngIf="!loading"
[dataSource]="filteredRequests">



<ng-container matColumnDef="id">

<th mat-header-cell *matHeaderCellDef>
Id
</th>

<td mat-cell *matCellDef="let r">

{{r.id}}

</td>

</ng-container>



<ng-container matColumnDef="category">

<th mat-header-cell *matHeaderCellDef>
Categoría
</th>

<td mat-cell *matCellDef="let r">

{{r.category}}

</td>

</ng-container>



<ng-container matColumnDef="description">

<th mat-header-cell *matHeaderCellDef>
Descripción
</th>

<td mat-cell *matCellDef="let r">

{{r.description}}

</td>

</ng-container>



<ng-container matColumnDef="priority">

<th mat-header-cell *matHeaderCellDef>
Prioridad
</th>

<td mat-cell *matCellDef="let r">

{{r.priority}}

</td>

</ng-container>



<ng-container matColumnDef="status">

<th mat-header-cell *matHeaderCellDef>
Estado
</th>

<td mat-cell *matCellDef="let r">

{{r.status}}

</td>

</ng-container>



<ng-container matColumnDef="date">

<th mat-header-cell *matHeaderCellDef>
Fecha
</th>

<td mat-cell *matCellDef="let r">

{{r.requestDate | date}}

</td>

</ng-container>



<ng-container matColumnDef="actions">

<th mat-header-cell *matHeaderCellDef>
Acciones
</th>


<td mat-cell *matCellDef="let r">


<!-- Detalle -->
<button
mat-raised-button
color="accent"
[routerLink]="['/detail', r.id]">

Detalle

</button>

</td>

</ng-container>



<tr
mat-header-row
*matHeaderRowDef="displayedColumns">
</tr>


<tr
mat-row
*matRowDef="let row; columns: displayedColumns;">
</tr>


</table>
