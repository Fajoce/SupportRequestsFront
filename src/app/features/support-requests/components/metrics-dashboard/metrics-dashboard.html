<div class="metrics-container">


    <mat-card class="metric-card total">

        <div class="metric-header">

            <mat-icon>
                assignment
            </mat-icon>

            <span>Total</span>

        </div>


        <h1>
            {{metrics?.total || 0}}
        </h1>


    </mat-card>



    <mat-card class="metric-card pending">

        <div class="metric-header">

            <mat-icon>
                schedule
            </mat-icon>

            <span>Pendientes</span>

        </div>


        <h1>
            {{metrics?.pending || 0}}
        </h1>


    </mat-card>




    <mat-card class="metric-card approved">

        <div class="metric-header">

            <mat-icon>
                check_circle
            </mat-icon>

            <span>Aprobadas</span>

        </div>


        <h1>
            {{metrics?.approved || 0}}
        </h1>


    </mat-card>




    <mat-card class="metric-card rejected">

        <div class="metric-header">

            <mat-icon>
                cancel
            </mat-icon>

            <span>Rechazadas</span>

        </div>


        <h1>
            {{metrics?.rejected || 0}}
        </h1>


    </mat-card>


</div>
